[tools]
# Ketch: Web search and scrape CLI tool
# https://github.com/1broseidon/ketch
"github:1broseidon/ketch" = "latest"
sonarqube-cli = "latest"

# Language runtimes — replaces pyenv, nvm, fnm, and the rustup curl installer
node = "26.10.0"
python = "3.14.7"
rust = "1.98.1"

# CLI tools previously installed by hand or via a separate installer
fzf = "0.74.4"
bun = "1.4.2"
direnv = "2.37.1"
starship = "1.26.0"

# CLI tools previously installed per-OS via Ansible/brew — moved here so
# every personal machine gets the same version regardless of what apt/brew
# happen to ship. Anything with real OS integration (gpg, syncthing, zsh,
# system libraries like graphviz/librsvg/libtool) stays OS-managed instead.
gh = "2.101.0"
# aqua's fd build has no darwin/amd64 release (Intel Mac) — force the cargo
# backend so this installs identically on every personal machine.
"cargo:fd-find" = "10.5.0"
jq = "1.8.2"
ripgrep = "15.2.0"
pandoc = "3.11"
tmux = "3.7c"
ffmpeg = "9.0.2"
cmake = "4.4.3"
difftastic = "0.70.0"
git-lfs = "3.8.0"
helm = "4.3.0"
helmfile = "1.8.0"
imagemagick = "7.1.2_31"
kubectl = "1.37.1"
sqlite = "3.53.4"
terraform = "1.16.4"
heroku = "11.10.1"
claude-code = "2.1.285"
# pi coding agent (pi.dev, by Earendil) — aqua binary, npm package as fallback
pi = "0.99.1"
# rtk — CLI proxy that compresses bash output before the agent reads it
# (rtk-ai/rtk, Apache-2.0, single Rust binary). Wire into an agent with
# `rtk init -g --agent <name>`.
rtk = "0.50.0"
1password-cli = "2.39.0"
vale = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]

