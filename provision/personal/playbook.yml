---
- name: Provision personal machines (cross-platform)
  hosts: personal
  become: no

  roles:
    - common

- name: Provision personal Linux machines
  hosts: linux
  become: yes

  roles:
    - linux

- name: Stow dotfiles and sync mise tool versions on personal Linux machines
  hosts: linux
  become: no

  roles:
    - dotfiles

- name: Provision personal Mac
  hosts: mac
  become: no

  roles:
    - mac
