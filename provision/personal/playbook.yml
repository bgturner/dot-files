---
- name: Provision personal machines (cross-platform)
  hosts: personal
  become: no

  roles:
    - common

- name: Provision personal Linux machines
  hosts: linux
  become: yes

  roles:
    - linux

- name: Stow dotfiles, sync mise tools, and set up per-user installs on personal Linux machines
  hosts: linux
  become: no

  roles:
    - dotfiles
    - linux_user

- name: Apply GNOME desktop preferences on personal Linux machines
  hosts: linux
  become: no

  roles:
    - gnome_desktop

- name: Install personal-only apps and tools (kept off work boxes)
  hosts: personal_extras
  become: no

  roles:
    - personal_extras

- name: Set up Electron/JS development prerequisites
  hosts: electron_dev
  become: yes

  roles:
    - electron_dev

- name: Set up a KVM/libvirt host for QA virtual machines
  hosts: vm_host
  become: no

  roles:
    - vm_host

- name: Provision personal Mac
  hosts: mac
  become: no

  roles:
    - mac
