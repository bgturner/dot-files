---
# Branch to clone on fresh hosts. Override per run to test a feature branch:
#   ansible-playbook ... -e dotfiles_version=mise-bootstrapper
dotfiles_version: master

# Stow packages every Linux host gets. Groups add to this via
# dotfiles_stow_packages_extra (see group_vars/) rather than overriding it,
# so the base set can't be dropped by accident.
dotfiles_stow_packages_base:
  - zsh
  - bash
  - git
  - tmux
  - emacs
  - vim
  - mise
  - starship
  - sqlite
dotfiles_stow_packages_extra: []
