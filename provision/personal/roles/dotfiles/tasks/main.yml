---
# Mirrors bootstrap.sh's Stow + mise install steps for remote Linux hosts,
# where there's no one at the keyboard to run bootstrap.sh by hand.
# Deliberately scoped to [linux] only (see playbook.yml) — the personal Mac
# already runs bootstrap.sh directly against its own working copy, and
# auto-pulling that repo here could stomp on in-progress local work.

- name: Clone dot-files repo if not already present
  ansible.builtin.git:
    repo: https://github.com/bgturner/dot-files.git
    dest: "{{ ansible_facts.env.HOME }}/.dot-files"
    version: "{{ dotfiles_version }}"
    update: no

# Without this, an already-provisioned host never sees new dotfiles commits.
# Only fast-forwards a clean tree on whatever branch is checked out, so local
# edits or a diverged branch are never overwritten (the latter fails loudly).
- name: Pull latest dotfiles if the working tree is clean
  ansible.builtin.shell: |
    set -e
    cd "{{ ansible_facts.env.HOME }}/.dot-files"
    if [ -n "$(git status --porcelain)" ]; then
      echo "SKIPPED: local changes present"
      exit 0
    fi
    git pull --ff-only
  args:
    executable: /bin/bash
  register: dotfiles_pull
  changed_when: "'Already up to date' not in dotfiles_pull.stdout and 'SKIPPED' not in dotfiles_pull.stdout"

- name: Warn when the pull was skipped because of local changes
  ansible.builtin.debug:
    msg: "~/.dot-files has uncommitted changes; skipped pulling. Commit or stash them on the host, then re-run."
  when: "'SKIPPED' in dotfiles_pull.stdout"

- name: Stow dotfiles, backing up any pre-existing real files that would conflict
  ansible.builtin.shell: |
    set -e
    cd "{{ ansible_facts.env.HOME }}/.dot-files"
    PACKAGES="zsh bash git tmux emacs vim mise ghostty starship sqlite"
    stow -n -v -d . -t "$HOME" $PACKAGES 2>&1 \
      | sed -n 's/.*existing target \(.*\) since neither.*/\1/p' \
      | while read -r rel; do
          f="$HOME/$rel"
          if [ -e "$f" ] && [ ! -L "$f" ]; then
            mv "$f" "$f.pre-stow"
          fi
        done
    stow -v -d . -t "$HOME" $PACKAGES
  args:
    executable: /bin/bash
  register: stow_result
  changed_when: "'LINK: ' in stow_result.stderr"

- name: Install mise-managed tool versions
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/mise install"
  args:
    chdir: "{{ ansible_facts.env.HOME }}/.dot-files"
  register: mise_install_result
  changed_when: "'installed 0 tools' not in mise_install_result.stderr"
