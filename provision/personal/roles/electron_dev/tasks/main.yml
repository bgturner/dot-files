---
# What Electron/JS work needs from the OS. Node, bun and friends are
# mise-managed (base config.toml); this is only the system side.

- name: Install Electron runtime libraries, headless display, and .deb packaging tools
  apt:
    state: present
    name:
      # Electron's shared-library dependencies. A GNOME desktop already
      # pulls these in; listed so the role stands on its own.
      - libnss3
      - libgtk-3-0t64
      - libgbm1
      - libasound2t64
      - libxss1
      - libxtst6
      - libsecret-1-0 # keychain access (safeStorage, keytar)
      # Virtual X server for running Electron tests without a display (xvfb-run)
      - xvfb
      # electron-forge's deb maker
      - fakeroot
      - dpkg-dev
