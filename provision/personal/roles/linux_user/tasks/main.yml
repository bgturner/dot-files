---
# Installs that belong in the login user's $HOME. Kept out of the `linux`
# role because that play runs with become, so ansible_facts.env.HOME there
# resolves to /root and these landed in root's home instead.

- name: Use zsh as the login shell (starship and mise are wired up in .zshrc)
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: /usr/bin/zsh
  become: yes

- name: Ensure ~/.fonts exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.fonts"
    state: directory
    mode: "0755"

- name: Install Nerd Fonts
  ansible.builtin.unarchive:
    src: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/{{ item }}.zip"
    dest: "{{ ansible_facts.env.HOME }}/.fonts"
    remote_src: yes
    creates: "{{ ansible_facts.env.HOME }}/.fonts/{{ item }}-marker"
  loop:
    - JetBrainsMono
    - SourceCodePro
  register: nerd_fonts_installed

- name: Mark Nerd Fonts as installed
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.fonts/{{ item }}-marker"
    state: touch
    mode: "0644"
  loop:
    - JetBrainsMono
    - SourceCodePro

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f
  when: nerd_fonts_installed.changed
