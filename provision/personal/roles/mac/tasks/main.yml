---
# Most CLI dev tools (rust, direnv, fzf, bun, starship, plus fd, gh, git-lfs,
# jq, pandoc, ripgrep, sqlite, tmux, kubectl, helm/helmfile, cmake,
# difftastic, imagemagick, terraform, heroku, claude-code, 1password-cli) are
# mise-managed (.config/mise/config.toml) instead of brew — same version on
# every personal machine, not whatever Homebrew happens to ship. What's left
# here either needs real OS integration (gpg's keyring, syncthing as a
# service), isn't a mise concept at all (GUI casks, system libraries), or —
# coreutils specifically — mise's registry entry is uutils/coreutils (a
# different Rust reimplementation, one multi-call binary, no `g`-prefixed
# gls/gcat/etc.), not a substitute for GNU coreutils. Stays on brew.
# kube-ps1 is dropped too: Starship's built-in kubernetes module replaces it.

- name: Install Homebrew formulae
  community.general.homebrew:
    name:
      - coreutils
      - gpg
      - graphviz
      - grep
      - ispell
      - librsvg
      - libtool
      - neovim
      - stow
    state: present

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name:
      - 1password
      - amethyst
      - cmux
      - docker
      - emacs-app
      - font-fira-code-nerd-font
      - font-jetbrains-mono-nerd-font
      - font-sauce-code-pro-nerd-font
      - ghostty
      - gcloud-cli
      - syncthing
      - visual-studio-code
    state: present
