---
# Personal-machine apps and tools — kept off work boxes, which run only the
# base linux/linux_user roles. The play runs as the login user (so Krew lands
# in their $HOME); apt tasks escalate individually.

- name: Install personal apps (backup, sync, graphics, multimedia)
  apt:
    state: present
    name:
      - restic
      - syncthing
      - gimp
      - gpick
      - inkscape
      - audacity
      - clementine
      - obs-studio
      - vlc
  become: yes

- name: Install Krew (kubectl plugin manager)
  ansible.builtin.shell: |
    set -e
    cd "$(mktemp -d)"
    OS="$(uname | tr '[:upper:]' '[:lower:]')"
    ARCH="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/')"
    KREW="krew-${OS}_${ARCH}"
    curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/${KREW}.tar.gz"
    tar zxvf "${KREW}.tar.gz"
    "./${KREW}" install krew
  args:
    creates: "{{ ansible_facts.env.HOME }}/.krew/bin/kubectl-krew"

- name: Install kubectl-ctx and kubectl-ns via Krew
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.krew/bin/kubectl-krew install {{ item }}"
  loop:
    - ctx
    - ns
  environment:
    PATH: "{{ ansible_facts.env.HOME }}/.krew/bin:{{ ansible_facts.env.PATH }}"
  changed_when: true
